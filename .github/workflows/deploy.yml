name: Test, secure, and deploy Telegram bot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  LAMBDA_ARCHITECTURE: arm64
  PIP_LAMBDA_PLATFORM: manylinux2014_aarch64
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::590183760311:role/GitHubActions-ToEnWikipediaBot
  AWS_RETRY_MODE: standard
  AWS_MAX_ATTEMPTS: "10"

jobs:
  test:
    name: Test on Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade boto3

      - name: Compile and run tests
        run: |
          python -m compileall -q ToEnWikipediaBot.py monitor.py scripts tests
          python -m unittest discover -s tests -v

      - name: Build and verify the ARM64 Lambda dependencies
        run: |
          rm -rf arm-package-test
          python -m pip install \
            --platform "${PIP_LAMBDA_PLATFORM}" \
            --implementation cp \
            --python-version "${PYTHON_VERSION}" \
            --only-binary=:all: \
            --target arm-package-test \
            -r requirements.txt
          python scripts/verify_lambda_package.py arm-package-test "${LAMBDA_ARCHITECTURE}"

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  deploy:
    name: Deploy free-tier architecture
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: bot-production-deployment
      cancel-in-progress: false
    env:
      DEPLOYMENT_SNAPSHOT_DIR: /tmp/bot-previous-release-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Refuse a stale production deployment
        run: |
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${GITHUB_SHA}" != "${MAIN_SHA}" ]; then
            echo "::error::This run is no longer main. Run the workflow on current main instead."
            exit 1
          fi

      - name: Report OIDC identity claims without exposing tokens
        run: python scripts/inspect_oidc.py

      - name: Configure short-lived AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: ToEnWikipediaBotDeploy
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 10

      - name: Refresh repository-scoped OIDC policy
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          python -m pip install --upgrade boto3
          python scripts/bootstrap_oidc_v2.py

      - name: Record credential migration status
        run: echo "AWS deployment is using short-lived repository-scoped GitHub OIDC credentials."

      - name: Build verified ARM64 bot and monitor packages
        run: |
          python -m pip install --upgrade pip boto3
          rm -rf package-arm64 monitor-package
          mkdir -p package-arm64 monitor-package

          python -m pip install \
            --platform "${PIP_LAMBDA_PLATFORM}" \
            --implementation cp \
            --python-version "${PYTHON_VERSION}" \
            --only-binary=:all: \
            --target package-arm64 \
            -r requirements.txt
          cp ToEnWikipediaBot.py package-arm64/
          python scripts/verify_lambda_package.py package-arm64 "${LAMBDA_ARCHITECTURE}"
          (cd package-arm64 && zip -q -r ../package-arm64.zip .)

          cp monitor.py monitor-package/
          (cd monitor-package && zip -q -r ../monitor-package.zip .)

      - name: Capture the current production release for rollback
        id: snapshot
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: python scripts/deployment_snapshot.py capture

      - name: Record start of production changes
        id: production
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Validate exact ARM64 package on the worker canary
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          BOT_ZIP_PATH: package-arm64.zip
        run: python scripts/deploy_arm64.py --canary-only

      - name: Prepare queues, state, monitoring, alerts, and authenticated webhook
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          BOT_ZIP_PATH: package-arm64.zip
          MONITOR_ZIP_PATH: monitor-package.zip
          GITHUB_SHA: ${{ github.sha }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          STATUS_CHANNEL_ID: ${{ secrets.STATUS_CHANNEL_ID }}
          STATUS_CHANNEL_URL: ${{ secrets.STATUS_CHANNEL_URL }}
          STATUS_BOT_TOKEN: ${{ secrets.STATUS_BOT_TOKEN }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '1' }}
        run: python scripts/configure_aws.py

      - name: Run immediate external health check
        run: |
          aws lambda invoke \
            --function-name ToEnWikipediaBotMonitor \
            --payload '{"source":"deployment-smoke-test"}' \
            --cli-binary-format raw-in-base64-out \
            monitor-response.json
          cat monitor-response.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("monitor-response.json").read_text())
          if not result.get("endpoint_ok") or not result.get("webhook_ok"):
              raise SystemExit(f"Post-deployment endpoint/webhook check failed: {result}")
          if result.get("endpoint_version") != os.environ["GITHUB_SHA"][:12]:
              raise SystemExit("The live bot does not match this deployment commit")
          PY

      - name: Remove legacy API Gateway route after smoke test
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: python scripts/finalize_cutover.py

      - name: Upload sanitized deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aws-deployment-diagnostics-${{ github.run_id }}
          path: |
            deployment-failure.json
            monitor-response.json
          if-no-files-found: warn
          retention-days: 7

      - name: Restore the previous production release on failure
        if: ${{ (failure() || cancelled()) && steps.production.outputs.started == 'true' }}
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: python scripts/deployment_snapshot.py restore

      - name: Delete private rollback data from the runner
        if: always()
        run: rm -rf "${DEPLOYMENT_SNAPSHOT_DIR}"
